version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dependencias-maven:
        patterns:
          - "*"
    ignore:
      # Migracoes de versao principal exigem ADR, plano e testes dedicados.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      acoes-github:
        patterns:
          - "*"
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      imagens-docker:
        patterns:
          - "*"
    ignore:
      # O projeto demonstra explicitamente o LTS 21. A tag composta dessas
      # imagens pode fazer o Dependabot trocar tambem a versao do Java.
      - dependency-name: maven
      - dependency-name: eclipse-temurin
    open-pull-requests-limit: 2
